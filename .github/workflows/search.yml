name: Busca de passagens

on:
  schedule:
    # 06h e 18h horário de Fortaleza (UTC-3) = 09h e 21h UTC
    - cron: "0 9 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar busca
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: npm run search

      - name: Commitar histórico de preços
        run: |
          git config user.name "monitor-passagens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: busca de preços ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          else
            echo "Nenhuma mudança em data/prices.db"
          fi
