name: Busca de passagens

on:
  schedule:
    # 06h e 18h horário de Fortaleza (UTC-3) = 09h e 21h UTC
    - cron: "0 9 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Qual execução simular"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - night

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências
        run: npm ci

      - name: Determinar tipo de execução
        id: run_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.run_type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            echo "value=morning" >> "$GITHUB_OUTPUT"
          else
            echo "value=night" >> "$GITHUB_OUTPUT"
          fi

      - name: Rodar busca
        env:
          AMADEUS_API_KEY: ${{ secrets.AMADEUS_API_KEY }}
          AMADEUS_API_SECRET: ${{ secrets.AMADEUS_API_SECRET }}
        run: npx tsx scripts/run-search.ts --run=${{ steps.run_type.outputs.value }}

      - name: Commitar histórico de preços
        run: |
          git config user.name "monitor-passagens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: busca de preços ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          else
            echo "Nenhuma mudança em data/prices.db"
          fi
